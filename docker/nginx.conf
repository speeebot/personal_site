user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # (global config: MIME types, logging, etc.)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ACME challenge location
    server {
        listen 80;
        server_name shawndiaz.dev www.shawndiaz.dev;

        # Ensure the webroot directory exists and has proper permissions
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name shawndiaz.dev www.shawndiaz.dev;

        ssl_certificate /etc/nginx/certs/shawndiaz.dev/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/shawndiaz.dev/privkey.pem;
        ssl_trusted_certificate /etc/nginx/certs/shawndiaz.dev/fullchain.pem;

        # SSL configuration
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Root directory and index files
        root /usr/share/nginx/html;
        index index.html;

        # Handle React routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}
