version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    # Publish HTTP and HTTPS from container to host
    ports:
      - "80:80"
      - "443:443"
    # Mount the certs folder so we can use them in the container
    volumes:
      # Mount the non-www certs
      - /etc/letsencrypt/live/shawndiaz.dev/fullchain.pem:/etc/nginx/certs/shawndiaz.dev-fullchain.pem:ro
      - /etc/letsencrypt/live/shawndiaz.dev/privkey.pem:/etc/nginx/certs/shawndiaz.dev-privkey.pem:ro

      # Mount the www certs
      - /etc/letsencrypt/live/www.shawndiaz.dev/fullchain.pem:/etc/nginx/certs/www.shawndiaz.dev-fullchain.pem:ro
      - /etc/letsencrypt/live/www.shawndiaz.dev/privkey.pem:/etc/nginx/certs/www.shawndiaz.dev-privkey.pem:ro
      
      # Mount the standard Let's Encrypt config & dhparams
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf:ro
      - /etc/letsencrypt/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem:ro
      - ./certs:/etc/nginx/certs:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - certbot
    # Always restart unless manually stopped
    restart: unless-stopped

  certbot:
    build:
      context: .
      dockerfile: ./docker/certbot/Dockerfile
    volumes:
      - ./certs:/etc/letsencrypt/live
      - ./letsencrypt:/etc/letsencrypt
      - ./www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email speeebot@gmail.com--agree-tos --no-eff-email -d shawndiaz.dev -d www.shawndiaz.dev --force-renewal
    restart: unless-stopped
