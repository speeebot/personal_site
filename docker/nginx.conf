user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # (global config: MIME types, logging, etc.)

    # 1) Catch-all on port 80 (optional)
    server {
        listen 80 default_server;
        return 444;
    }

    # 2) Non-WWW Domain
    server {
        listen 80;
        listen 443 ssl;
        server_name shawndiaz.dev;

        # Non-www cert
        ssl_certificate     /etc/nginx/certs/shawndiaz.dev-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/shawndiaz.dev-privkey.pem;

        # recommended settings if available:
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # example: redirect non-www to www
        return 301 https://www.shawndiaz.dev$request_uri;
    }

    # 3) WWW Domain
    server {
        listen 80;
        server_name www.shawndiaz.dev;
        return 301 https://www.shawndiaz.dev$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.shawndiaz.dev;

        # WWW cert
        ssl_certificate     /etc/nginx/certs/www.shawndiaz.dev-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/www.shawndiaz.dev-privkey.pem;

        # Optional recommended settings 
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Serve the site
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
